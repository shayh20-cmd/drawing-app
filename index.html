<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SketchDraw – ציור וקטורי</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@400;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="icons.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#6c63ff;--purple-light:#e8e0ff;--border:#e0e0e0;
  --bg:#fafafa;--sidebar-bg:#fff;--toolbar-bg:#fff;
  --text:#1e1e2e;--muted:#888;
}
body{font-family:'Nunito','Assistant',sans-serif;background:var(--bg);overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}

/* ── MENU BAR ── */
.menu-bar{
  height:44px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:6px;
  z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-shrink:0;
}
.logo{font-family:'Caveat',cursive;font-size:22px;font-weight:700;color:var(--purple);margin-right:8px;letter-spacing:-0.5px}
.menu-btn{
  padding:4px 12px;border:1px solid var(--border);border-radius:7px;
  background:#fff;cursor:pointer;font-size:12px;font-family:'Nunito','Assistant',sans-serif;
  color:#333;transition:all .15s;white-space:nowrap;font-weight:600;
}
.menu-btn:hover{background:#f5f5f5;border-color:#bbb}
.menu-btn.danger{color:#e44}
.menu-sep{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0}
.menu-spacer{flex:1}
.zoom-badge{
  padding:3px 10px;border:1px solid var(--border);border-radius:6px;
  font-size:12px;font-weight:700;color:#555;min-width:56px;text-align:center;
  cursor:pointer;background:#fff;
}

/* ── BODY LAYOUT ── */
.app-body{flex:1;display:flex;overflow:hidden;position:relative}

/* ── TOOLBAR ── */
.toolbar{
  width:56px;background:var(--toolbar-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;
  z-index:100;box-shadow:1px 0 4px rgba(0,0,0,.06);flex-shrink:0;overflow-y:auto;
}
.tool-btn{
  width:42px;height:42px;border:none;border-radius:9px;background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;color:#555;position:relative;flex-shrink:0;
}
.tool-btn:hover{background:#f0f0f0}
.tool-btn.active{background:var(--purple-light);color:var(--purple)}
.tool-btn svg{width:19px;height:19px;pointer-events:none}
.tool-sep{width:34px;height:1px;background:var(--border);margin:3px 0;flex-shrink:0}
.tool-btn::after{
  content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);
  background:#333;color:#fff;padding:4px 9px;border-radius:5px;font-size:11px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:300;
}
.tool-btn:hover::after{opacity:1}

/* ── ICON PICKER ── */
.icon-pop{position:absolute;left:60px;top:10px;z-index:250;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:10px;display:none;
  grid-template-columns:repeat(5,40px);gap:4px;max-height:calc(100vh - 40px);overflow-y:auto}
.icon-pop.open{display:grid}
.icon-pop button{width:40px;height:40px;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;padding:6px}
.icon-pop button:hover{background:#f3f2ff;border-color:var(--purple)}
.icon-pop img{width:100%;height:100%;display:block;object-fit:contain}
.icon-pop .icon-add{border:1px dashed #c9c6ff;color:var(--purple)}

/* ── CANVAS CONTAINER ── */
.canvas-wrap{flex:1;position:relative;overflow:hidden}
#c{position:absolute;top:0;left:0}

/* ── HINTS ── */
.hint{
  position:absolute;bottom:14px;left:70px;font-size:11px;color:#bbb;
  font-family:'Nunito','Assistant',sans-serif;pointer-events:none;
}

/* ── PROPERTIES SIDEBAR ── */
.sidebar{
  width:0;overflow:hidden;background:var(--sidebar-bg);border-left:1px solid var(--border);
  z-index:100;box-shadow:-1px 0 6px rgba(0,0,0,.07);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:width .18s ease;
}
.sidebar.open{width:260px;overflow-y:auto}

.sb-head{
  padding:12px 14px 8px;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #f0f0f0;
  flex-shrink:0;
}
.sb-sec{padding:10px 14px;border-bottom:1px solid #f0f0f0}
.sb-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.sb-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sb-row:last-child{margin-bottom:0}

/* color palette */
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pc{
  width:19px;height:19px;border-radius:4px;cursor:pointer;
  border:2px solid transparent;transition:all .12s;flex-shrink:0;
}
.pc:hover,.pc.sel{border-color:var(--purple);transform:scale(1.15)}
.pc.trans{
  background:
    linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%) 0 0/6px 6px,
    linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%) 3px 3px/6px 6px;
  background-color:#fff;
}

.color-swatch{
  width:24px;height:24px;border-radius:5px;border:2px solid var(--border);
  cursor:pointer;flex-shrink:0;position:relative;
}
.color-swatch input{position:absolute;opacity:0;width:0;height:0}

/* sliders */
.sl{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:#e0e0e0;outline:none;cursor:pointer}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--purple);cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--purple)}
.sl-val{font-size:11px;color:#666;min-width:30px;text-align:right;font-weight:600}

/* button groups */
.bg{display:flex;gap:3px}
.sg{
  flex:1;padding:6px 4px;border:1px solid var(--border);border-radius:6px;
  background:#fff;cursor:pointer;font-size:11px;text-align:center;
  transition:all .12s;color:#444;font-family:'Nunito','Assistant',sans-serif;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.sg:hover{background:#f5f5f5}
.sg.active{background:var(--purple-light);border-color:var(--purple);color:var(--purple)}
.sg svg{width:16px;height:16px;pointer-events:none;display:block}

/* selects / inputs */
.sel-inp{
  flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:6px;
  font-size:12px;font-family:'Nunito','Assistant',sans-serif;color:#333;background:#fff;cursor:pointer;
}
.num-inp{width:62px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:'Nunito','Assistant',sans-serif}

/* ── TEXT EDITOR OVERLAY ── */
#te{
  position:fixed;display:none;border:none;outline:none;background:transparent;
  font-family:'Caveat','Assistant',cursive;font-size:20px;color:var(--text);
  resize:none;overflow:hidden;min-width:60px;min-height:28px;
  z-index:500;padding:2px 4px;line-height:1.3;caret-color:var(--purple);
}
</style>
</head>
<body>

<!-- MENU BAR -->
<div class="menu-bar">
  <span class="logo">✏ SketchDraw</span>
  <div class="menu-sep"></div>
  <button class="menu-btn" onclick="newFile()">חדש</button>
  <button class="menu-btn" onclick="saveFile()">💾 שמור</button>
  <button class="menu-btn" onclick="loadFile()">📂 פתח</button>
  <div class="menu-sep"></div>
  <button class="menu-btn" onclick="exportPNG()">🖼 PNG</button>
  <button class="menu-btn" onclick="exportPDF()">📄 PDF</button>
  <div class="menu-sep"></div>
  <button class="menu-btn" onclick="undo()">↩ בטל</button>
  <button class="menu-btn" onclick="redo()">↪ חזור</button>
  <div class="menu-sep"></div>
  <button class="menu-btn" onclick="fitAll()">⊡ התאם</button>
  <div class="menu-sep"></div>
  <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:#555;cursor:pointer;font-weight:600;white-space:nowrap" title="יישור אובייקטים ומרווחים שווים אוטומטית בעת גרירה">
    <input type="checkbox" id="chk-smartguides" checked onchange="toggleSmartGuides(this.checked)" style="cursor:pointer">
    🧲 קווי יישור חכמים
  </label>
  <div class="menu-spacer"></div>
  <span class="zoom-badge" id="zoom-lbl" onclick="resetZoom()" title="לחץ לאיפוס זום">100%</span>
  <div class="menu-sep"></div>
  <button class="menu-btn danger" onclick="deleteSelected()">🗑 מחק</button>
</div>

<div class="app-body">

  <!-- TOOLBAR -->
  <div class="toolbar" id="toolbar">
    <button class="tool-btn active" data-tool="select" data-tip="בחירה (V)" onclick="setTool('select')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M5 3l14 9-7 1-4 7L5 3z"/>
      </svg>
    </button>
    <button class="tool-btn" data-tool="pan" data-tip="הזזה (H)" onclick="setTool('pan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 11V6a2 2 0 0 0-4 0v1M14 7V4a2 2 0 0 0-4 0v3M10 7.5V5a2 2 0 0 0-4 0v5.5M6 10.5l0 2A6 6 0 0 0 18 12.5V11a2 2 0 0 0-4 0"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="rectangle" data-tip="מלבן (R)" onclick="setTool('rectangle')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
      </svg>
    </button>
    <button class="tool-btn" data-tool="ellipse" data-tip="עיגול (E)" onclick="setTool('ellipse')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <ellipse cx="12" cy="12" rx="10" ry="7"/>
      </svg>
    </button>
    <button class="tool-btn" data-tool="diamond" data-tip="מעויין (D)" onclick="setTool('diamond')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <polygon points="12,2 22,12 12,22 2,12"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="arrow" data-tip="חץ ישר (A)" onclick="setTool('arrow')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="19" x2="19" y2="5"/>
        <polyline points="12,5 19,5 19,12"/>
      </svg>
    </button>
    <button class="tool-btn" data-tool="curvedarrow" data-tip="חץ מעוקל (C)" onclick="setTool('curvedarrow')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 19 Q 4 8 19 5"/>
        <polyline points="13,4 19,5 18,11"/>
      </svg>
    </button>
    <button class="tool-btn" data-tool="line" data-tip="קו (L)" onclick="setTool('line')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="4" y1="20" x2="20" y2="4"/>
      </svg>
    </button>
    <button class="tool-btn" data-tool="freehand" data-tip="ציור חופשי (P)" onclick="setTool('freehand')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 17c3-3 5-9 9-9s2 6 6 6a3 3 0 0 0 3-3"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="text" data-tip="טקסט (T)" onclick="setTool('text')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
      </svg>
    </button>
    <button class="tool-btn" id="btn-icons" data-tip="אייקונים" onclick="toggleIconPop()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><circle cx="17.5" cy="6.5" r="3.5"/><path d="M6.5 14l3.5 6H3z"/><path d="M17.5 14l1 2.3 2.5.2-1.9 1.6.6 2.4-2.2-1.3-2.2 1.3.6-2.4-1.9-1.6 2.5-.2z"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="eraser" data-tip="מחק (X)" onclick="setTool('eraser')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20H7L3 16l11-11 6 6-4 4"/>
        <line x1="6" y1="17" x2="11" y2="12"/>
      </svg>
    </button>
    <div style="flex:1"></div>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="הגדל (Ctrl++)" onclick="zoomIn()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="הקטן (Ctrl+-)" onclick="zoomOut()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/>
      </svg>
    </button>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap" id="wrap">
    <canvas id="c"></canvas>
    <div class="icon-pop" id="icon-pop"></div>
    <input type="file" id="icon-file" accept="image/png,image/svg+xml,image/jpeg,image/webp" multiple style="display:none" onchange="loadIconFiles(this.files);this.value=''">
    <div class="hint">V=בחירה · H=הזזה · R=מלבן · E=עיגול · A=חץ · C=חץ מעוקל · T=טקסט · P=עיפרון · Del=מחק · Ctrl+Z=בטל</div>
  </div>

  <!-- PROPERTIES SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-head">מאפיינים</div>

    <!-- Stroke color -->
    <div class="sb-sec">
      <div class="sb-lbl">צבע קו</div>
      <div class="pal" id="pal-stroke"></div>
      <div class="sb-row" style="margin-top:7px">
        <label class="color-swatch" id="sw-stroke">
          <input type="color" id="inp-stroke" onchange="applyProp('strokeColor',this.value);defaultStyle.strokeColor=this.value">
        </label>
        <span style="font-size:11px;color:#999">מותאם אישית</span>
      </div>
    </div>

    <!-- Fill -->
    <div class="sb-sec" id="sec-fill">
      <div class="sb-lbl">מילוי</div>
      <div class="bg" id="fill-style-btns">
        <button class="sg active" data-fs="none"        title="ללא" onclick="setFillStyle('none')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
        <button class="sg"        data-fs="solid"       title="מלא" onclick="setFillStyle('solid')">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
        <button class="sg"        data-fs="hachure"     title="פסים" onclick="setFillStyle('hachure')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="4" y1="12" x2="12" y2="4"/><line x1="4" y1="20" x2="20" y2="4"/><line x1="12" y1="20" x2="20" y2="12"/></svg>
        </button>
        <button class="sg"        data-fs="cross-hatch" title="רשת" onclick="setFillStyle('cross-hatch')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </button>
      </div>
      <div class="pal" id="pal-fill" style="margin-top:7px"></div>
      <div class="sb-row" style="margin-top:7px">
        <label class="color-swatch" id="sw-fill">
          <input type="color" id="inp-fill" onchange="applyProp('fillColor',this.value);defaultStyle.fillColor=this.value">
        </label>
        <span style="font-size:11px;color:#999">מותאם אישית</span>
      </div>
    </div>

    <!-- Stroke width -->
    <div class="sb-sec">
      <div class="sb-lbl">עובי קו</div>
      <div class="sb-row">
        <input type="range" class="sl" id="sl-sw" min="1" max="16" value="2"
          oninput="document.getElementById('val-sw').textContent=this.value;applyProp('strokeWidth',+this.value);defaultStyle.strokeWidth=+this.value">
        <span class="sl-val" id="val-sw">2</span>
      </div>
    </div>

    <!-- Style (roughness) -->
    <div class="sb-sec" id="sec-rough">
      <div class="sb-lbl">סגנון</div>
      <div class="bg" id="rough-btns">
        <button class="sg"        data-r="0"   title="חלק" onclick="setRoughness(0)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
        <button class="sg active" data-r="1"   title="רגיל" onclick="setRoughness(1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 Q8 7 12 12 T20 12"/></svg>
        </button>
        <button class="sg"        data-r="2.5" title="גס" onclick="setRoughness(2.5)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15 L8 8 L11 16 L14 7 L17 15 L20 9"/></svg>
        </button>
      </div>
    </div>

    <!-- Line style -->
    <div class="sb-sec" id="sec-dash">
      <div class="sb-lbl">סגנון קו</div>
      <div class="bg" id="dash-btns">
        <button class="sg active" data-d="solid"  title="רציף" onclick="setDash('solid')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
        <button class="sg"        data-d="dashed" title="מקווקו" onclick="setDash('dashed')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12" stroke-dasharray="4.5 3.5"/></svg>
        </button>
        <button class="sg"        data-d="dotted" title="נקודות" onclick="setDash('dotted')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12" stroke-dasharray="0.5 4"/></svg>
        </button>
      </div>
    </div>

    <!-- Arrow -->
    <div class="sb-sec" id="sec-arrow">
      <div class="sb-lbl">חצים</div>
      <div class="bg" id="arrow-btns">
        <button class="sg"        data-arrow="none"  title="ללא" onclick="setArrow('none')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
        <button class="sg active" data-arrow="end"   title="→" onclick="setArrow('end')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="18" y2="12"/><polyline points="13,7 18,12 13,17"/></svg>
        </button>
        <button class="sg"        data-arrow="start" title="←" onclick="setArrow('start')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="20" y2="12"/><polyline points="11,7 6,12 11,17"/></svg>
        </button>
        <button class="sg"        data-arrow="both"  title="↔" onclick="setArrow('both')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="12" x2="17" y2="12"/><polyline points="11,7 6,12 11,17"/><polyline points="13,7 18,12 13,17"/></svg>
        </button>
      </div>
    </div>

    <!-- Opacity -->
    <div class="sb-sec">

<script>
// ═══════════════════════════════════════════════
//  PALETTE — muted earthy tones
// ═══════════════════════════════════════════════
const STROKE_COLORS = [
  '#d1d5db','#fca5a5','#fdba74','#fcd34d','#fde047',
  '#bef264','#86efac','#6ee7b7','#5eead4','#67e8f9',
  '#7dd3fc','#93c5fd','#a5b4fc','#c4b5fd','#d8b4fe',
  '#f0abfc','#f9a8d4','#fda4af','#9ca3af','#4b5563'
];
const FILL_COLORS = [
  'transparent',
  '#d1d5db','#fca5a5','#fdba74','#fcd34d','#fde047',
  '#bef264','#86efac','#6ee7b7','#5eead4','#67e8f9',
  '#7dd3fc','#93c5fd','#a5b4fc','#c4b5fd','#d8b4fe',
  '#f0abfc','#f9a8d4','#fda4af','#9ca3af','#4b5563'
];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let elements = [];
let selIds   = [];
let tool     = 'select';
let vp       = { x:0, y:0, s:1 };
let history  = [[]];
let histIdx  = 0;
let nid      = 1;

let drawing  = false;
let panning  = false;
let dragging = false;
let resizing = false;
let resHandle= null;
let drawStart= null;
let panStart = null;
let dragSnap = null;
let curEl    = null;
let fhPts    = [];
let editId   = null;

// Rotation
const ROTATABLE_TYPES = ['rectangle','ellipse','diamond','text','icon'];
const ROT_HANDLE_DIST = 26; // screen px above the top-center handle
const ROT_SNAP_DEG    = 5;  // magnetic snap window around each 45° step
function rotatePoint(px,py,cx,cy,rot) {
  if(!rot) return { x:px, y:py };
  const dx=px-cx, dy=py-cy, cos=Math.cos(rot), sin=Math.sin(rot);
  return { x: cx+dx*cos-dy*sin, y: cy+dx*sin+dy*cos };
}
// World point -> the element's own unrotated (local) coordinate space
function toLocal(el, wx, wy) {
  if(!el.rot) return { x:wx, y:wy };
  const b=bbox(el);
  return rotatePoint(wx, wy, b.x+b.w/2, b.y+b.h/2, -el.rot);
}

// Connection-point snapping
const CONNECTABLE_TYPES = ['rectangle','ellipse','diamond','text','icon'];
const SNAP_PX  = 14;  // distance (screen px) at which a point-target snaps
const HOVER_PX = 60;  // distance (screen px) at which nearby points light up
let snapPoint      = null; // {x,y,elId,anchor} currently snapped-to point
let snapCandidates = [];   // nearby points shown as hints

// Smart alignment / equal-spacing guides
const ALIGN_PX = 6; // snap threshold (screen px)
let smartGuides = true;
try { smartGuides = localStorage.getItem('sketchdraw_smartguides') !== '0'; } catch(err) {}
let guideLines = []; // active alignment/spacing guide lines for rendering
function toggleSmartGuides(v) {
  smartGuides = v;
  try { localStorage.setItem('sketchdraw_smartguides', v?'1':'0'); } catch(err) {}
  if(!v) { guideLines=[]; render(); }
}

let defaultStyle = {
  strokeColor:'#1c2b3a', fillColor:'transparent',
  fillStyle:'none', strokeWidth:2, roughness:1, opacity:1,
  dashStyle:'solid', arrowEnd:true, arrowStart:false,
  fontFamily:'Caveat', fontSize:20,
  fontWeight:'normal', fontStyle:'normal', textAlign:'left'
};

// ═══════════════════════════════════════════════
//  CANVAS & ROUGH SETUP
// ═══════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let rc;

function resize() {
  const w = document.getElementById('wrap');
  canvas.width  = w.clientWidth;
  canvas.height = w.clientHeight;
  rc = rough.canvas(canvas);
  render();
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════
//  COORDINATES
// ═══════════════════════════════════════════════
function s2w(x,y){ return { x:(x-vp.x)/vp.s, y:(y-vp.y)/vp.s } }
function w2s(x,y){ return { x:x*vp.s+vp.x,   y:y*vp.s+vp.y   } }
function epos(e) {
  const r = canvas.getBoundingClientRect();
  return { sx: e.clientX-r.left, sy: e.clientY-r.top };
}
function wpos(e) { const p=epos(e); return s2w(p.sx,p.sy) }

// ═══════════════════════════════════════════════
//  ELEMENT FACTORY
// ═══════════════════════════════════════════════
function mkEl(type, x1,y1, x2,y2) {
  const st = {...defaultStyle};
  const el = { id: nid++, type, style: st };

  if (type==='arrow'||type==='line') {
    el.x1=x1; el.y1=y1; el.x2=x2; el.y2=y2;
  } else if (type==='curvedarrow') {
    el.x1=x1; el.y1=y1; el.x2=x2; el.y2=y2;
    // control point starts at midpoint (perp offset applied on first move)
    el.cx=(x1+x2)/2; el.cy=(y1+y2)/2;
    el.ctrlSet=false; // user hasn't moved control point yet
  } else if (type==='freehand') {
    el.points = [[x1,y1]];
  } else if (type==='text') {
    el.x=x1; el.y=y1; el.w=200; el.h=40; el.text=''; el.rot=0;
  } else {
    el.x=Math.min(x1,x2); el.y=Math.min(y1,y2);
    el.w=Math.abs(x2-x1); el.h=Math.abs(y2-y1); el.rot=0;
  }
  return el;
}

// ═══════════════════════════════════════════════
//  BOUNDING BOX
// ═══════════════════════════════════════════════
function bbox(el) {
  if (el.type==='arrow'||el.type==='line') {
    const x=Math.min(el.x1,el.x2), y=Math.min(el.y1,el.y2);
    return { x, y, w:Math.max(1,Math.abs(el.x2-el.x1)), h:Math.max(1,Math.abs(el.y2-el.y1)) };
  }
  if (el.type==='curvedarrow') {
    const xs=[el.x1,el.cx,el.x2], ys=[el.y1,el.cy,el.y2];
    const x=Math.min(...xs),y=Math.min(...ys);
    return {x,y,w:Math.max(1,Math.max(...xs)-x),h:Math.max(1,Math.max(...ys)-y)};
  }
  if (el.type==='freehand') {
    if(!el.points||!el.points.length) return {x:0,y:0,w:1,h:1};
    let ax=Infinity,ay=Infinity,bx=-Infinity,by=-Infinity;
    for(const [px,py] of el.points){ax=Math.min(ax,px);ay=Math.min(ay,py);bx=Math.max(bx,px);by=Math.max(by,py);}
    return {x:ax,y:ay,w:Math.max(1,bx-ax),h:Math.max(1,by-ay)};
  }
  return { x:el.x, y:el.y, w:el.w||1, h:el.h||1 };
}

// ═══════════════════════════════════════════════
//  BEZIER UTILS
// ═══════════════════════════════════════════════
function quadBezierPt(t,x1,y1,cx,cy,x2,y2) {
  const mt=1-t;
  return { x:mt*mt*x1+2*mt*t*cx+t*t*x2, y:mt*mt*y1+2*mt*t*cy+t*t*y2 };
}
function ptBezierDist(px,py,x1,y1,cx,cy,x2,y2,n=24) {
  let min=Infinity;
  for(let i=0;i<=n;i++){
    const p=quadBezierPt(i/n,x1,y1,cx,cy,x2,y2);
    min=Math.min(min,Math.hypot(px-p.x,py-p.y));
  }
  return min;
}
// Tangent at t=1 of quadratic bezier
function bezierEndTangent(x1,y1,cx,cy,x2,y2) {
  return { dx: x2-cx, dy: y2-cy };
}
// Default curved-arrow perpendicular offset
function defaultCtrl(x1,y1,x2,y2) {
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const perp = Math.min(len*0.25, 60);
  return { cx: mx - dy/len*perp, cy: my + dx/len*perp };
}

// Draws a freehand stroke as a native canvas curve through midpoints —
// each source point acts as a quadratic control point, so the curve
// itself passes through the midpoints between consecutive points,
// giving one continuous, corner-free line with no rough.js resampling.
function drawSmoothFreehand(el, tCtx) {
  const pts=el.points, s=el.style;
  tCtx.save();
  tCtx.strokeStyle=s.strokeColor;
  tCtx.lineWidth=s.strokeWidth;
  tCtx.lineJoin='round'; tCtx.lineCap='round';
  if(s.dashStyle==='dashed') tCtx.setLineDash([10,6]);
  else if(s.dashStyle==='dotted') tCtx.setLineDash([2,8]);
  else tCtx.setLineDash([]);

  tCtx.beginPath();
  tCtx.moveTo(pts[0][0],pts[0][1]);
  if(pts.length<3) {
    for(let i=1;i<pts.length;i++) tCtx.lineTo(pts[i][0],pts[i][1]);
  } else {
    for(let i=1;i<pts.length-1;i++) {
      const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
      tCtx.quadraticCurveTo(x0,y0,(x0+x1)/2,(y0+y1)/2);
    }
    const last=pts[pts.length-1];
    tCtx.lineTo(last[0],last[1]);
  }
  tCtx.stroke();
  tCtx.restore();
}

// ═══════════════════════════════════════════════
//  HIT TESTING
// ═══════════════════════════════════════════════
function ptSegDist(px,py,x1,y1,x2,y2) {
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(!l2) return Math.hypot(px-x1,py-y1);
  const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l2));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}

function hit(el,wx,wy) {
  const m = 8/vp.s;
  if (el.type==='freehand') {
    if(!el.points||el.points.length<2) return false;
    for(let i=0;i<el.points.length-1;i++) {
      if(ptSegDist(wx,wy,...el.points[i],...el.points[i+1])<m*2) return true;
    }
    return false;
  }
  if (el.type==='arrow'||el.type==='line') {
    return ptSegDist(wx,wy,el.x1,el.y1,el.x2,el.y2) < m*2;
  }
  if (el.type==='curvedarrow') {
    return ptBezierDist(wx,wy,el.x1,el.y1,el.cx,el.cy,el.x2,el.y2) < m*2;
  }
  const { x:lx, y:ly } = toLocal(el, wx, wy); // rotated shapes: test in their own local space
  const b = bbox(el);
  if (el.type==='ellipse') {
    const cx=b.x+b.w/2,cy=b.y+b.h/2,rx=b.w/2,ry=b.h/2;
    if(el.style.fillStyle!=='none'){
      const dx=(lx-cx)/rx,dy=(ly-cy)/ry;
      if(dx*dx+dy*dy<=1) return true;
    }
    const da=(lx-cx)/(rx+m),db=(ly-cy)/(ry+m);
    if(da*da+db*db>1) return false;
    const dc=(lx-cx)/(rx-m),dd=(ly-cy)/(ry-m);
    return dc*dc+dd*dd>=1;
  }
  const inside = lx>=b.x-m && lx<=b.x+b.w+m && ly>=b.y-m && ly<=b.y+b.h+m;
  if(!inside) return false;
  if(el.style.fillStyle!=='none'||el.type==='text') return true;
  return lx<=b.x+m || lx>=b.x+b.w-m || ly<=b.y+m || ly>=b.y+b.h-m;
}

// ═══════════════════════════════════════════════
//  RESIZE HANDLES
// ═══════════════════════════════════════════════
const HANDLES8 = ['nw','n','ne','e','se','s','sw','w'];

function hpos(el, h) {
  if(el.type==='arrow'||el.type==='line') {
    if(h==='start') return {x:el.x1,y:el.y1};
    if(h==='end')   return {x:el.x2,y:el.y2};
  }
  if(el.type==='curvedarrow') {
    if(h==='start') return {x:el.x1,y:el.y1};
    if(h==='end')   return {x:el.x2,y:el.y2};
    if(h==='ctrl')  return {x:el.cx, y:el.cy};
  }
  const b=bbox(el);
  if(h==='rot') return { x:b.x+b.w/2, y:b.y-ROT_HANDLE_DIST/vp.s };
  return {
    nw:{x:b.x,      y:b.y},     n:{x:b.x+b.w/2, y:b.y},
    ne:{x:b.x+b.w,  y:b.y},     e:{x:b.x+b.w,   y:b.y+b.h/2},
    se:{x:b.x+b.w,  y:b.y+b.h}, s:{x:b.x+b.w/2, y:b.y+b.h},
    sw:{x:b.x,      y:b.y+b.h}, w:{x:b.x,        y:b.y+b.h/2}
  }[h];
}

function hitHandle(el,wx,wy) {
  const sz = 9/vp.s;
  if(el.type==='curvedarrow') {
    if(Math.hypot(wx-el.cx, wy-el.cy)<sz*1.3) return 'ctrl';
    if(Math.hypot(wx-el.x1, wy-el.y1)<sz) return 'start';
    if(Math.hypot(wx-el.x2, wy-el.y2)<sz) return 'end';
    return null;
  }
  if(el.type==='arrow'||el.type==='line') {
    if(Math.hypot(wx-el.x1,wy-el.y1)<sz) return 'start';
    if(Math.hypot(wx-el.x2,wy-el.y2)<sz) return 'end';
    return null;
  }
  const { x:lx, y:ly } = toLocal(el, wx, wy); // rotated shapes: handles are tested in local space
  if(ROTATABLE_TYPES.includes(el.type)) {
    const rp=hpos(el,'rot');
    if(rp && Math.hypot(lx-rp.x, ly-rp.y)<sz*1.2) return 'rot';
  }
  for(const h of HANDLES8) {
    const p=hpos(el,h);
    if(p && Math.abs(lx-p.x)<sz && Math.abs(ly-p.y)<sz) return h;
  }
  return null;
}

// ═══════════════════════════════════════════════
//  CONNECTION-POINT SNAPPING
// ═══════════════════════════════════════════════
function anchorPos(el, anchor) {
  if(!el) return null;
  if(anchor==='c') { const b=bbox(el); return { x:b.x+b.w/2, y:b.y+b.h/2 }; }
  return hpos(el, anchor);
}

function collectConnPoints() {
  const list=[];
  for(const el of elements) {
    if(!CONNECTABLE_TYPES.includes(el.type)) continue;
    for(const h of HANDLES8) { const p=hpos(el,h); if(p) list.push({x:p.x,y:p.y,anchor:h,elId:el.id}); }
    const b=bbox(el);
    list.push({x:b.x+b.w/2,y:b.y+b.h/2,anchor:'c',elId:el.id});
  }
  return list;
}

function findSnap(wx,wy) {
  const pts    = collectConnPoints();
  const hoverR = HOVER_PX/vp.s, snapR = SNAP_PX/vp.s;
  let nearest=null, nearestD=Infinity, cands=[];
  for(const p of pts) {
    const d=Math.hypot(wx-p.x,wy-p.y);
    if(d<hoverR) { cands.push(p); if(d<nearestD){nearestD=d;nearest=p;} }
  }
  snapCandidates = cands;
  snapPoint = (nearest && nearestD<=snapR) ? nearest : null;
  return snapPoint;
}

function clearSnap() { snapPoint=null; snapCandidates=[]; }

function updateBoundArrows(movedIds) {
  for(const el of elements) {
    if(el.type!=='arrow'&&el.type!=='line'&&el.type!=='curvedarrow') continue;
    if(el.startBinding && movedIds.has(el.startBinding.elId)) {
      const tgt=elements.find(e=>e.id===el.startBinding.elId);
      const p=tgt&&anchorPos(tgt, el.startBinding.anchor);
      if(p) { el.x1=p.x; el.y1=p.y; }
    }
    if(el.endBinding && movedIds.has(el.endBinding.elId)) {
      const tgt=elements.find(e=>e.id===el.endBinding.elId);
      const p=tgt&&anchorPos(tgt, el.endBinding.anchor);
      if(p) { el.x2=p.x; el.y2=p.y; }
    }
  }
}

// ═══════════════════════════════════════════════
//  SMART ALIGNMENT / EQUAL-SPACING GUIDES
// ═══════════════════════════════════════════════
function origSelectionBBox(ids) {
  let ax=Infinity,ay=Infinity,bx=-Infinity,by=-Infinity;
  for(const id of ids) {
    const or=dragSnap.els.find(e=>e.id===id); if(!or) continue;
    const b=bbox(or);
    ax=Math.min(ax,b.x); ay=Math.min(ay,b.y);
    bx=Math.max(bx,b.x+b.w); by=Math.max(by,b.y+b.h);
  }
  if(ax===Infinity) return null;
  return { x:ax, y:ay, w:bx-ax, h:by-ay };
}

// Computes an alignment/equal-spacing correction for a drag of `ids` by (dx,dy).
// Returns a corrected {dx,dy} and populates `guideLines` for rendering.
function applySmartGuides(ids, dx, dy) {
  guideLines = [];
  if(!smartGuides) return { dx, dy };
  const orig = origSelectionBBox(ids);
  if(!orig) return { dx, dy };
  const others = elements.filter(e=>!ids.includes(e.id)).map(bbox);
  if(!others.length) return { dx, dy };

  const thresh = ALIGN_PX/vp.s;
  let sel = { x:orig.x+dx, y:orig.y+dy, w:orig.w, h:orig.h };

  // ── edge / center alignment ──
  let bestXAbs=thresh, corrX=0, guideX=null;
  let bestYAbs=thresh, corrY=0, guideY=null;
  for(const b of others) {
    const oXs=[b.x,b.x+b.w/2,b.x+b.w], oYs=[b.y,b.y+b.h/2,b.y+b.h];
    for(const sx of [sel.x,sel.x+sel.w/2,sel.x+sel.w]) for(const ox of oXs) {
      const d=ox-sx;
      if(Math.abs(d)<bestXAbs) { bestXAbs=Math.abs(d); corrX=d; guideX={pos:ox, y1:Math.min(sel.y,b.y), y2:Math.max(sel.y+sel.h,b.y+b.h)}; }
    }
    for(const sy of [sel.y,sel.y+sel.h/2,sel.y+sel.h]) for(const oy of oYs) {
      const d=oy-sy;
      if(Math.abs(d)<bestYAbs) { bestYAbs=Math.abs(d); corrY=d; guideY={pos:oy, x1:Math.min(sel.x,b.x), x2:Math.max(sel.x+sel.w,b.x+b.w)}; }
    }
  }
  let ndx=dx+corrX, ndy=dy+corrY;
  if(guideX) guideLines.push({type:'v', pos:guideX.pos, from:guideX.y1-16, to:guideX.y2+16});
  if(guideY) guideLines.push({type:'h', pos:guideY.pos, from:guideY.x1-16, to:guideY.x2+16});

  // ── equal spacing (X axis: nearest left/right neighbor with vertical overlap) ──
  sel = { x:orig.x+ndx, y:orig.y+ndy, w:orig.w, h:orig.h };
  let leftB=null, leftGap=Infinity, rightB=null, rightGap=Infinity;
  for(const b of others) {
    const overlapY=Math.min(sel.y+sel.h,b.y+b.h)-Math.max(sel.y,b.y);
    if(overlapY<=0) continue;
    if(b.x+b.w<=sel.x) { const g=sel.x-(b.x+b.w); if(g<leftGap){leftGap=g;leftB=b;} }
    else if(b.x>=sel.x+sel.w) { const g=b.x-(sel.x+sel.w); if(g<rightGap){rightGap=g;rightB=b;} }
  }
  if(leftB && rightB && Math.abs(leftGap-rightGap)<thresh) {
    const avail=rightB.x-(leftB.x+leftB.w)-sel.w, gap=avail/2;
    const targetX=leftB.x+leftB.w+gap;
    ndx += (targetX-sel.x);
    guideLines.push({type:'space-x', y:sel.y+sel.h/2, leftX:leftB.x+leftB.w, midX1:targetX, midX2:targetX+sel.w, rightX:rightB.x});
  }

  // ── equal spacing (Y axis: nearest top/bottom neighbor with horizontal overlap) ──
  sel = { x:orig.x+ndx, y:orig.y+ndy, w:orig.w, h:orig.h };
  let topB=null, topGap=Infinity, botB=null, botGap=Infinity;
  for(const b of others) {
    const overlapX=Math.min(sel.x+sel.w,b.x+b.w)-Math.max(sel.x,b.x);
    if(overlapX<=0) continue;
    if(b.y+b.h<=sel.y) { const g=sel.y-(b.y+b.h); if(g<topGap){topGap=g;topB=b;} }
    else if(b.y>=sel.y+sel.h) { const g=b.y-(sel.y+sel.h); if(g<botGap){botGap=g;botB=b;} }
  }
  if(topB && botB && Math.abs(topGap-botGap)<thresh) {
    const avail=botB.y-(topB.y+topB.h)-sel.h, gap=avail/2;
    const targetY=topB.y+topB.h+gap;
    ndy += (targetY-sel.y);
    guideLines.push({type:'space-y', x:sel.x+sel.w/2, topY:topB.y+topB.h, midY1:targetY, midY2:targetY+sel.h, botY:botB.y});
  }

  return { dx:ndx, dy:ndy };
}

// ═══════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════
function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fafafa';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawDotGrid();

  ctx.save();
  ctx.translate(vp.x,vp.y);
  ctx.scale(vp.s,vp.s);

  // the element being text-edited is shown by the textarea overlay instead
  for(const el of elements) if(el.id!==editId) drawEl(el, ctx, rc);
  if(curEl) drawEl(curEl, ctx, rc);

  for(const id of selIds) {
    const el=elements.find(e=>e.id===id);
    if(el) drawSel(el);
  }
  if(selIds.length>1) drawMultiBox();
  if(snapCandidates.length) drawSnapIndicators();
  if(guideLines.length) drawGuideLines();

  ctx.restore();
}

function drawGuideLines() {
  ctx.save();
  const tick=5/vp.s;
  for(const g of guideLines) {
    if(g.type==='v') {
      ctx.strokeStyle='#e64980'; ctx.lineWidth=1/vp.s; ctx.setLineDash([4/vp.s,3/vp.s]);
      ctx.beginPath(); ctx.moveTo(g.pos,g.from); ctx.lineTo(g.pos,g.to); ctx.stroke();
    } else if(g.type==='h') {
      ctx.strokeStyle='#e64980'; ctx.lineWidth=1/vp.s; ctx.setLineDash([4/vp.s,3/vp.s]);
      ctx.beginPath(); ctx.moveTo(g.from,g.pos); ctx.lineTo(g.to,g.pos); ctx.stroke();
    } else if(g.type==='space-x') {
      ctx.strokeStyle='#f08c00'; ctx.lineWidth=1.4/vp.s; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(g.leftX,g.y); ctx.lineTo(g.midX1,g.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g.midX2,g.y); ctx.lineTo(g.rightX,g.y); ctx.stroke();
      for(const tx of [g.leftX,g.midX1,g.midX2,g.rightX]) { ctx.beginPath(); ctx.moveTo(tx,g.y-tick); ctx.lineTo(tx,g.y+tick); ctx.stroke(); }
    } else if(g.type==='space-y') {
      ctx.strokeStyle='#f08c00'; ctx.lineWidth=1.4/vp.s; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(g.x,g.topY); ctx.lineTo(g.x,g.midY1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g.x,g.midY2); ctx.lineTo(g.x,g.botY); ctx.stroke();
      for(const ty of [g.topY,g.midY1,g.midY2,g.botY]) { ctx.beginPath(); ctx.moveTo(g.x-tick,ty); ctx.lineTo(g.x+tick,ty); ctx.stroke(); }
    }
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawSnapIndicators() {
  const rHollow=4/vp.s, rSnap=6/vp.s;
  ctx.save();
  for(const p of snapCandidates) {
    const isActive = snapPoint && p.elId===snapPoint.elId && p.anchor===snapPoint.anchor;
    if(isActive) continue;
    ctx.beginPath(); ctx.arc(p.x,p.y,rHollow,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='rgba(108,99,255,.55)'; ctx.lineWidth=1.3/vp.s; ctx.stroke();
  }
  if(snapPoint) {
    ctx.beginPath(); ctx.arc(snapPoint.x,snapPoint.y,rSnap,0,Math.PI*2);
    ctx.fillStyle='#6c63ff'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2/vp.s; ctx.stroke();
  }
  ctx.restore();
}

function drawDotGrid() {
  const gs = 24*vp.s;
  const ox = ((vp.x%gs)+gs)%gs;
  const oy = ((vp.y%gs)+gs)%gs;
  ctx.fillStyle='#c8c8c8';
  for(let x=ox;x<canvas.width;x+=gs)
    for(let y=oy;y<canvas.height;y+=gs) {
      ctx.beginPath(); ctx.arc(x,y,1,0,Math.PI*2); ctx.fill();
    }
}

function roughOpts(el) {
  const s = el.style;
  const fc = s.fillStyle==='none' ? undefined : (s.fillColor==='transparent'?undefined:s.fillColor);
  const opts = {
    stroke: s.strokeColor,
    strokeWidth: s.strokeWidth,
    roughness: s.roughness,
    seed: el.id*7,
    hachureGap: s.strokeWidth*5,
    hachureAngle: -41,
    fill: fc,
    fillStyle: (s.fillStyle==='solid')?'solid':s.fillStyle
  };
  if(s.dashStyle==='dashed') opts.strokeLineDash=[10,6];
  else if(s.dashStyle==='dotted') opts.strokeLineDash=[2,8];
  return opts;
}

function drawEl(el, tCtx, tRc) {
  tCtx.save();
  tCtx.globalAlpha = el.style.opacity;
  const b = bbox(el);
  const opts = roughOpts(el);

  if(ROTATABLE_TYPES.includes(el.type) && el.rot) {
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    tCtx.translate(cx,cy); tCtx.rotate(el.rot); tCtx.translate(-cx,-cy);
  }

  switch(el.type) {
    case 'rectangle':
      tRc.rectangle(b.x,b.y,b.w,b.h,opts); break;
    case 'icon': {
      const img=iconImage(el);
      if(img.complete&&img.naturalWidth) tCtx.drawImage(img,b.x,b.y,b.w,b.h);
      break;
    }
    case 'ellipse':
      tRc.ellipse(b.x+b.w/2,b.y+b.h/2,b.w,b.h,opts); break;
    case 'diamond': {
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      tRc.polygon([[cx,b.y],[b.x+b.w,cy],[cx,b.y+b.h],[b.x,cy]],opts); break;
    }
    case 'line':
    case 'arrow':
      tRc.line(el.x1,el.y1,el.x2,el.y2,opts);
      if(el.type==='arrow') {
        const dx=el.x2-el.x1, dy=el.y2-el.y1;
        drawHeads(el, tCtx, tRc, dx, dy);
      }
      break;
    case 'curvedarrow': {
      const path=`M ${el.x1},${el.y1} Q ${el.cx},${el.cy} ${el.x2},${el.y2}`;
      tRc.path(path,{...opts,fill:undefined});
      const {dx,dy}=bezierEndTangent(el.x1,el.y1,el.cx,el.cy,el.x2,el.y2);
      drawHeads(el, tCtx, tRc, dx, dy);
      break;
    }
    case 'freehand':
      if(el.points&&el.points.length>1) {
        // Freehand bypasses rough.js entirely: its path renderer samples
        // curves into small segments and perturbs each one, which reads as
        // a flicker along the stroke even at low roughness. A native canvas
        // curve stays perfectly continuous instead.
        drawSmoothFreehand(el, tCtx);
      }
      break;
    case 'text': {
      const s=el.style;
      const font=`${s.fontStyle==='italic'?'italic ':''}`+
                 `${s.fontWeight==='bold'?'bold ':''}`+
                 `${s.fontSize}px '${s.fontFamily}','Assistant',cursive`;
      tCtx.font=font;
      tCtx.fillStyle=s.strokeColor;
      tCtx.textAlign=s.textAlign||'left';
      const lines=(el.text||'').split('\n');
      const lh=s.fontSize*1.35;
      let tx=el.x;
      if(s.textAlign==='center') tx=el.x+(el.w||200)/2;
      if(s.textAlign==='right')  tx=el.x+(el.w||200);
      // centre each line in a 1.35 line box — the same layout the edit textarea uses
      tCtx.textBaseline='middle';
      tCtx.direction='ltr';
      for(let i=0;i<lines.length;i++) tCtx.fillText(lines[i],tx,el.y+lh*(i+0.5));
      break;
    }
  }
  tCtx.restore();
}

// ── SKETCHY ARROWHEADS via rough.js ──────────────
function drawHeads(el, tCtx, tRc, dx, dy) {
  const s  = el.style;
  const len = Math.hypot(dx,dy);
  if(!len) return;
  const ux=dx/len, uy=dy/len;
  const aLen = Math.min(20, len*0.28) + s.strokeWidth * 2.2;
  const ang  = 0.44;

  const headOpts = {
    stroke: s.strokeColor,
    strokeWidth: s.strokeWidth,
    roughness: Math.max(0.6, s.roughness * 0.85),
    seed: el.id * 13,
    bowing: 1.2,
  };

  function head(tx,ty,dirX,dirY,seed) {
    const p1x=tx-dirX*aLen+dirY*aLen*Math.tan(ang);
    const p1y=ty-dirY*aLen-dirX*aLen*Math.tan(ang);
    const p2x=tx-dirX*aLen-dirY*aLen*Math.tan(ang);
    const p2y=ty-dirY*aLen+dirX*aLen*Math.tan(ang);
    tRc.line(tx,ty,p1x,p1y,{...headOpts,seed:seed});
    tRc.line(tx,ty,p2x,p2y,{...headOpts,seed:seed+3});
  }

  const endX = el.x2, endY = el.y2;
  const startX = el.x1, startY = el.y1;

  if(s.arrowEnd!==false)
    head(endX, endY, ux, uy, el.id*13);
  if(s.arrowStart) {
    // for start we reverse direction
    const {dx:sdx,dy:sdy} = el.type==='curvedarrow'
      ? { dx:el.x1-el.cx, dy:el.y1-el.cy }
      : { dx:-dx, dy:-dy };
    const sl=Math.hypot(sdx,sdy)||1;
    head(startX, startY, sdx/sl, sdy/sl, el.id*17);
  }
}

function drawSel(el) {
  const b=bbox(el), p=8/vp.s;
  ctx.save();
  if(ROTATABLE_TYPES.includes(el.type) && el.rot) {
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    ctx.translate(cx,cy); ctx.rotate(el.rot); ctx.translate(-cx,-cy);
  }
  ctx.strokeStyle='#6c63ff';
  ctx.lineWidth=1.5/vp.s;
  ctx.setLineDash([5/vp.s,4/vp.s]);
  ctx.strokeRect(b.x-p,b.y-p,b.w+p*2,b.h+p*2);
  ctx.setLineDash([]);

  const sz=5/vp.s;

  // Curved arrow: draw guide lines to ctrl point + special circle handle
  if(el.type==='curvedarrow') {
    ctx.strokeStyle='rgba(108,99,255,0.35)';
    ctx.lineWidth=1/vp.s;
    ctx.setLineDash([3/vp.s,3/vp.s]);
    ctx.beginPath();
    ctx.moveTo(el.x1,el.y1); ctx.lineTo(el.cx,el.cy); ctx.lineTo(el.x2,el.y2);
    ctx.stroke();
    ctx.setLineDash([]);
    // ctrl handle — diamond shape
    ctx.fillStyle='#fff'; ctx.strokeStyle='#6c63ff'; ctx.lineWidth=1.5/vp.s;
    const csz=sz*1.6;
    ctx.beginPath();
    ctx.moveTo(el.cx,el.cy-csz);
    ctx.lineTo(el.cx+csz,el.cy);
    ctx.lineTo(el.cx,el.cy+csz);
    ctx.lineTo(el.cx-csz,el.cy);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  const hs=(el.type==='arrow'||el.type==='line') ? ['start','end']
          :(el.type==='curvedarrow')              ? ['start','end']
          : HANDLES8;
  for(const h of hs) {
    const pos=hpos(el,h); if(!pos) continue;
    ctx.fillStyle='#fff'; ctx.strokeStyle='#6c63ff'; ctx.lineWidth=1.5/vp.s;
    ctx.beginPath(); ctx.rect(pos.x-sz,pos.y-sz,sz*2,sz*2); ctx.fill(); ctx.stroke();
  }

  // Rotation handle — small circle above the top-center handle, on a guide line
  if(ROTATABLE_TYPES.includes(el.type)) {
    const n=hpos(el,'n'), r=hpos(el,'rot');
    ctx.strokeStyle='rgba(108,99,255,0.5)'; ctx.lineWidth=1/vp.s; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(r.x,r.y); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.strokeStyle='#6c63ff'; ctx.lineWidth=1.5/vp.s;
    ctx.beginPath(); ctx.arc(r.x,r.y,sz*0.9,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawMultiBox() {
  let mx=Infinity,my=Infinity,Mx=-Infinity,My=-Infinity;
  for(const id of selIds) {
    const el=elements.find(e=>e.id===id); if(!el) continue;
    const b=bbox(el);
    mx=Math.min(mx,b.x);my=Math.min(my,b.y);
    Mx=Math.max(Mx,b.x+b.w);My=Math.max(My,b.y+b.h);
  }
  const p=16/vp.s;
  ctx.save();
  ctx.strokeStyle='#6c63ff'; ctx.lineWidth=1/vp.s;
  ctx.setLineDash([6/vp.s,4/vp.s]);
  ctx.strokeRect(mx-p,my-p,Mx-mx+p*2,My-my+p*2);
  ctx.setLineDash([]);
  ctx.restore();
}

// ═══════════════════════════════════════════════
//  MOUSE EVENTS
// ═══════════════════════════════════════════════
canvas.addEventListener('mousedown',   onDown);
canvas.addEventListener('mousemove',   onMove);
canvas.addEventListener('mouseup',     onUp);
canvas.addEventListener('dblclick',    onDbl);
canvas.addEventListener('wheel',       onWheel, {passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

function onDown(e) {
  if(e.button!==0&&e.button!==1) return;
  e.preventDefault();
  // preventDefault keeps focus in the textarea, so its blur never fires:
  // a click outside the text box ends editing explicitly
  if(editId) { document.getElementById('te').blur(); finishText(); render(); return; }
  const sp=epos(e), wp=s2w(sp.sx,sp.sy);

  if(tool==='pan'||e.button===1||e.altKey) {
    panning=true;
    panStart={sx:sp.sx,sy:sp.sy,vx:vp.x,vy:vp.y};
    canvas.style.cursor='grabbing';
    return;
  }

  if(tool==='select') {
    if(selIds.length===1) {
      const sel=elements.find(e=>e.id===selIds[0]);
      if(sel) {
        const h=hitHandle(sel,wp.x,wp.y);
        if(h) {
          resizing=true; resHandle=h;
          dragSnap={wp:{...wp}, el:JSON.parse(JSON.stringify(sel))};
          return;
        }
      }
    }
    let found=null;
    for(let i=elements.length-1;i>=0;i--) {
      if(hit(elements[i],wp.x,wp.y)){found=elements[i];break;}
    }
    if(found) {
      if(!e.shiftKey) selIds=[found.id];
      else selIds=selIds.includes(found.id)?selIds.filter(i=>i!==found.id):[...selIds,found.id];
      dragging=true;
      dragSnap={wp:{...wp}, els:JSON.parse(JSON.stringify(elements))};
    } else {
      if(!e.shiftKey) selIds=[];
    }
    updateSidebar(); render(); return;
  }

  if(tool==='eraser') {
    for(let i=elements.length-1;i>=0;i--) {
      if(hit(elements[i],wp.x,wp.y)){
        saveHist();
        const delId=elements[i].id;
        elements.splice(i,1);
        for(const el of elements) {
          if(el.startBinding && el.startBinding.elId===delId) el.startBinding=null;
          if(el.endBinding && el.endBinding.elId===delId) el.endBinding=null;
        }
        render();break;
      }
    }
    return;
  }

  if(tool==='text') { startText(wp.x,wp.y); return; }

  drawing=true;
  let sx=wp.x, sy=wp.y, startBind=null;
  if(tool==='arrow'||tool==='line'||tool==='curvedarrow') {
    const snap=findSnap(wp.x,wp.y);
    if(snap) { sx=snap.x; sy=snap.y; startBind={elId:snap.elId,anchor:snap.anchor}; }
  }
  drawStart={x:sx,y:sy};
  curEl=mkEl(tool,sx,sy,sx,sy);
  if(startBind) curEl.startBinding=startBind;
  if(tool==='freehand') { fhPts=[[wp.x,wp.y]]; curEl.points=fhPts; clearSnap(); }
}

function onMove(e) {
  const sp=epos(e), wp=s2w(sp.sx,sp.sy);

  if(panning) {
    vp.x=panStart.vx+sp.sx-panStart.sx;
    vp.y=panStart.vy+sp.sy-panStart.sy;
    render(); return;
  }

  if(resizing&&selIds.length===1) {
    const el=elements.find(e=>e.id===selIds[0]); if(!el) return;
    const orig=dragSnap.el, ob=bbox(orig);

    if(el.type==='curvedarrow') {
      if(resHandle==='ctrl')  { el.cx=wp.x; el.cy=wp.y; el.ctrlSet=true; clearSnap(); }
      if(resHandle==='start') { const sn=findSnap(wp.x,wp.y); if(sn){el.x1=sn.x;el.y1=sn.y;el.startBinding={elId:sn.elId,anchor:sn.anchor};} else {el.x1=wp.x;el.y1=wp.y;el.startBinding=null;} }
      if(resHandle==='end')   { const sn=findSnap(wp.x,wp.y); if(sn){el.x2=sn.x;el.y2=sn.y;el.endBinding={elId:sn.elId,anchor:sn.anchor};} else {el.x2=wp.x;el.y2=wp.y;el.endBinding=null;} }
    } else if(el.type==='arrow'||el.type==='line') {
      if(resHandle==='start'){ const sn=findSnap(wp.x,wp.y); if(sn){el.x1=sn.x;el.y1=sn.y;el.startBinding={elId:sn.elId,anchor:sn.anchor};} else {el.x1=wp.x;el.y1=wp.y;el.startBinding=null;} }
      if(resHandle==='end')  { const sn=findSnap(wp.x,wp.y); if(sn){el.x2=sn.x;el.y2=sn.y;el.endBinding={elId:sn.elId,anchor:sn.anchor};} else {el.x2=wp.x;el.y2=wp.y;el.endBinding=null;} }
    } else if(resHandle==='rot') {
      clearSnap();
      const cx=ob.x+ob.w/2, cy=ob.y+ob.h/2;
      let rot = Math.atan2(wp.y-cy, wp.x-cx) + Math.PI/2;
      rot = ((rot % (Math.PI*2)) + Math.PI*2) % (Math.PI*2); // normalize to [0, 2π)
      const step = Math.PI/4; // 45°
      const nearest = Math.round(rot/step)*step % (Math.PI*2);
      let diff = Math.abs(rot-nearest); diff = Math.min(diff, Math.PI*2-diff);
      el.rot = (diff < ROT_SNAP_DEG*Math.PI/180) ? nearest : rot;
      updateBoundArrows(new Set([el.id]));
    } else {
      clearSnap();
      // Resize in the shape's own (unrotated) local space, pivoting on its
      // original center, so a rotated shape resizes along its own axes.
      const rot = orig.rot||0;
      const lp = rotatePoint(wp.x, wp.y, ob.x+ob.w/2, ob.y+ob.h/2, -rot);
      let {x,y,w,h}=ob;
      if(resHandle.includes('e')) w=lp.x-x;
      if(resHandle.includes('s')) h=lp.y-y;
      if(resHandle.includes('w')){w=ob.x+ob.w-lp.x;x=lp.x;}
      if(resHandle.includes('n')){h=ob.y+ob.h-lp.y;y=lp.y;}
      el.x=x;el.y=y;el.w=Math.max(1,w);el.h=Math.max(1,h);
      updateBoundArrows(new Set([el.id]));
    }
    render(); return;
  }

  if(dragging&&selIds.length>0) {
    let dx=wp.x-dragSnap.wp.x, dy=wp.y-dragSnap.wp.y;
    if(!e.shiftKey) { const adj=applySmartGuides(selIds,dx,dy); dx=adj.dx; dy=adj.dy; }
    else guideLines=[];
    for(const id of selIds) {
      const el=elements.find(e=>e.id===id);
      const or=dragSnap.els.find(e=>e.id===id);
      if(!el||!or) continue;
      if(el.type==='curvedarrow') {
        el.x1=or.x1+dx;el.y1=or.y1+dy;
        el.x2=or.x2+dx;el.y2=or.y2+dy;
        el.cx=or.cx+dx;el.cy=or.cy+dy;
        el.startBinding=null; el.endBinding=null;
      } else if(el.type==='arrow'||el.type==='line'){
        el.x1=or.x1+dx;el.y1=or.y1+dy;el.x2=or.x2+dx;el.y2=or.y2+dy;
        el.startBinding=null; el.endBinding=null;
      } else if(el.type==='freehand') {
        el.points=or.points.map(([px,py])=>[px+dx,py+dy]);
      } else { el.x=or.x+dx; el.y=or.y+dy; }
    }
    updateBoundArrows(new Set(selIds));
    render(); return;
  }

  if(drawing) {
    if(tool==='freehand') {
      const last=fhPts[fhPts.length-1];
      if(!last || Math.hypot(wp.x-last[0],wp.y-last[1])>2/vp.s) {
        const FH_SMOOTH=0.45; // 0=raw jittery input, closer to 1=heavier lag
        const px = last ? last[0]+(wp.x-last[0])*(1-FH_SMOOTH) : wp.x;
        const py = last ? last[1]+(wp.y-last[1])*(1-FH_SMOOTH) : wp.y;
        fhPts.push([px,py]); curEl.points=[...fhPts]; render();
      }
      return;
    }
    let x1=drawStart.x,y1=drawStart.y,x2=wp.x,y2=wp.y;
    if(e.shiftKey) {
      if(tool==='rectangle'||tool==='ellipse'||tool==='diamond') {
        const sz=Math.max(Math.abs(x2-x1),Math.abs(y2-y1));
        x2=x1+(x2>x1?sz:-sz); y2=y1+(y2>y1?sz:-sz);
      } else {
        const dx=x2-x1,dy=y2-y1,ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),l=Math.hypot(dx,dy);
        x2=x1+Math.cos(ang)*l; y2=y1+Math.sin(ang)*l;
      }
    }
    const isLineTool=tool==='arrow'||tool==='line'||tool==='curvedarrow';
    if(isLineTool && !e.shiftKey) {
      const snap=findSnap(x2,y2);
      if(snap) { x2=snap.x; y2=snap.y; curEl.endBinding={elId:snap.elId,anchor:snap.anchor}; }
      else curEl.endBinding=null;
    } else {
      clearSnap();
      if(isLineTool) curEl.endBinding=null;
    }
    if(tool==='arrow'||tool==='line') {
      curEl.x1=x1;curEl.y1=y1;curEl.x2=x2;curEl.y2=y2;
    } else if(tool==='curvedarrow') {
      curEl.x1=x1;curEl.y1=y1;curEl.x2=x2;curEl.y2=y2;
      if(!curEl.ctrlSet) {
        const c=defaultCtrl(x1,y1,x2,y2);
        curEl.cx=c.cx; curEl.cy=c.cy;
      }
    } else {
      curEl.x=Math.min(x1,x2);curEl.y=Math.min(y1,y2);curEl.w=Math.abs(x2-x1);curEl.h=Math.abs(y2-y1);
    }
    render(); return;
  }

  updateCursor(wp);
}

function onUp(e) {
  clearSnap();
  guideLines=[];
  if(panning) { panning=false; canvas.style.cursor=tool==='pan'?'grab':''; return; }
  if(resizing) { resizing=false;resHandle=null;saveHist();render();return; }
  if(dragging) { dragging=false;saveHist();return; }
  if(drawing) {
    drawing=false;
    if(curEl) {
      let ok=false;
      if(curEl.type==='freehand') ok=curEl.points&&curEl.points.length>2;
      else if(curEl.type==='arrow'||curEl.type==='line'||curEl.type==='curvedarrow')
        ok=Math.hypot(curEl.x2-curEl.x1,curEl.y2-curEl.y1)>4;
      else ok=curEl.w>4||curEl.h>4;
      if(ok) { saveHist();elements.push(curEl);selIds=[curEl.id];updateSidebar(); }
      curEl=null;
    }
    render();
  }
}

function onDbl(e) {
  const wp=wpos(e);
  for(let i=elements.length-1;i>=0;i--) {
    const el=elements[i];
    if(hit(el,wp.x,wp.y)) { startText(wp.x,wp.y,el); return; }
  }
}

function onWheel(e) {
  e.preventDefault();
  const sp=epos(e);
  if(e.ctrlKey||e.metaKey) {
    const f=e.deltaY<0?1.1:0.9;
    const ns=Math.max(0.05,Math.min(20,vp.s*f));
    vp.x=sp.sx-(sp.sx-vp.x)*(ns/vp.s);
    vp.y=sp.sy-(sp.sy-vp.y)*(ns/vp.s);
    vp.s=ns;
  } else { vp.x-=e.deltaX; vp.y-=e.deltaY; }
  updZoom(); render();
}

function updateCursor(wp) {
  if(tool==='pan')    { canvas.style.cursor='grab'; return; }
  if(tool==='text')   { canvas.style.cursor='text'; return; }
  if(tool==='eraser') { canvas.style.cursor='cell'; return; }
  if(tool!=='select') { canvas.style.cursor='crosshair'; return; }
  if(selIds.length===1) {
    const sel=elements.find(e=>e.id===selIds[0]);
    if(sel) {
      const h=hitHandle(sel,wp.x,wp.y);
      if(h) {
        if(h==='ctrl') { canvas.style.cursor='move'; return; }
        if(h==='rot')  { canvas.style.cursor='grab'; return; }
        const m={nw:'nw-resize',n:'n-resize',ne:'ne-resize',e:'e-resize',
                 se:'se-resize',s:'s-resize',sw:'sw-resize',w:'w-resize',
                 start:'move',end:'move'};
        canvas.style.cursor=m[h]||'move'; return;
      }
    }
  }
  for(let i=elements.length-1;i>=0;i--) {
    if(hit(elements[i],wp.x,wp.y)) { canvas.style.cursor='move'; return; }
  }
  canvas.style.cursor='default';
}

// ═══════════════════════════════════════════════
//  TEXT EDITING
// ═══════════════════════════════════════════════
function startText(wx,wy,existing) {
  const ta=document.getElementById('te');
  let el=existing;
  if(!el) { el=mkEl('text',wx,wy,wx+200,wy+40); elements.push(el); }
  editId=el.id; selIds=[el.id];

  const sp=w2s(el.x,el.y);
  const cr=canvas.getBoundingClientRect();
  const fs=el.style.fontSize*vp.s;
  const wPx=(el.w||200)*vp.s, hPx=(el.h||40)*vp.s;

  // padding:0 + same line-height as the canvas renderer, so the overlay sits
  // exactly on top of where the text is drawn (no double image, no jump)
  ta.style.cssText=`
    display:block; left:${cr.left+sp.x}px; top:${cr.top+sp.y}px; padding:0;
    font:${el.style.fontStyle==='italic'?'italic ':''}`+
    `${el.style.fontWeight==='bold'?'bold ':''}${fs}px/1.35 '${el.style.fontFamily}','Assistant',cursive;
    color:${el.style.strokeColor}; text-align:${el.style.textAlign||'left'};
    width:${Math.max(100,wPx)}px; min-width:60px; min-height:${fs*1.35}px; height:auto;
    transform-origin:${wPx/2}px ${hPx/2}px; transform:rotate(${el.rot||0}rad);
  `;
  ta.value=el.text||'';
  ta.focus(); ta.select();
  autoResize(ta);
  render();
}

function finishText() {
  const ta=document.getElementById('te');
  if(editId) {
    const id=editId;
    const el=elements.find(e=>e.id===id);
    if(el) {
      el.text=ta.value;
      if(!el.text.trim()) {
        elements=elements.filter(e=>e.id!==id); selIds=[];
        for(const e2 of elements) {
          if(e2.startBinding && e2.startBinding.elId===id) e2.startBinding=null;
          if(e2.endBinding && e2.endBinding.elId===id) e2.endBinding=null;
        }
      } else {
        saveHist();
        const lines=el.text.split('\n');
        el.w=Math.max(...lines.map(l=>l.length))*el.style.fontSize*0.62+20;
        el.h=lines.length*el.style.fontSize*1.35+10;
        updateBoundArrows(new Set([id]));
      }
    }
    editId=null;
  }
  ta.style.display='none'; ta.value='';
  updateSidebar(); render();
}

function autoResize(ta) {
  ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px';
}

// ═══════════════════════════════════════════════
//  TOOL SELECTION
// ═══════════════════════════════════════════════
function setTool(t) {
  tool=t;
  clearSnap();
  guideLines=[];
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>
    b.classList.toggle('active', b.dataset.tool===t));
  canvas.style.cursor=t==='pan'?'grab':t==='text'?'text':t==='select'?'default':'crosshair';
  if(t!=='select') { selIds=[]; updateSidebar(); render(); }
}

// ═══════════════════════════════════════════════
//  ZOOM
// ═══════════════════════════════════════════════
function zoomAt(cx,cy,f) {
  const ns=Math.max(0.05,Math.min(20,vp.s*f));
  vp.x=cx-(cx-vp.x)*(ns/vp.s); vp.y=cy-(cy-vp.y)*(ns/vp.s); vp.s=ns;
  updZoom(); render();
}
function zoomIn()    { zoomAt(canvas.width/2,canvas.height/2,1.25); }
function zoomOut()   { zoomAt(canvas.width/2,canvas.height/2,0.8);  }
function resetZoom() { vp={x:0,y:0,s:1}; updZoom(); render(); }
function fitAll() {
  if(!elements.length) return;
  let ax=Infinity,ay=Infinity,bx=-Infinity,by=-Infinity;
  for(const el of elements) {
    const b=bbox(el);
    ax=Math.min(ax,b.x);ay=Math.min(ay,b.y);
    bx=Math.max(bx,b.x+b.w);by=Math.max(by,b.y+b.h);
  }
  const pad=60, cw=bx-ax+pad*2, ch=by-ay+pad*2;
  vp.s=Math.min(canvas.width/cw, canvas.height/ch, 2);
  vp.x=(canvas.width-cw*vp.s)/2-(ax-pad)*vp.s;
  vp.y=(canvas.height-ch*vp.s)/2-(ay-pad)*vp.s;
  updZoom(); render();
}
function updZoom() {
  document.getElementById('zoom-lbl').textContent=Math.round(vp.s*100)+'%';
}

// ═══════════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════════
function saveHist() {
  const snap=JSON.parse(JSON.stringify(elements));
  history=history.slice(0,histIdx+1);
  history.push(snap); histIdx=history.length-1;
}
function undo() {
  if(histIdx>0){histIdx--;elements=JSON.parse(JSON.stringify(history[histIdx]));selIds=[];updateSidebar();render();}
}
function redo() {
  if(histIdx<history.length-1){histIdx++;elements=JSON.parse(JSON.stringify(history[histIdx]));selIds=[];updateSidebar();render();}
}

// ═══════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════
document.addEventListener('keydown', e=>{
  const ta=document.getElementById('te');
  if(document.activeElement===ta) return;
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;

  if(e.ctrlKey||e.metaKey) {
    switch(e.key.toLowerCase()) {
      case 'z': e.preventDefault(); e.shiftKey?redo():undo(); break;
      case 'y': e.preventDefault(); redo(); break;
      case '=': case '+': e.preventDefault(); zoomIn(); break;
      case '-': e.preventDefault(); zoomOut(); break;
      case '0': e.preventDefault(); resetZoom(); break;
      case 's': e.preventDefault(); saveFile(); break;
      case 'd': e.preventDefault(); duplicateSelected(); break;
      case 'a': e.preventDefault(); selAll(); break;
      case 'c': e.preventDefault(); copySelected(); break;
      case 'x': e.preventDefault(); cutSelected(); break;
      case 'v': e.preventDefault(); pasteClipboard(); break;
    }
    return;
  }

  const km={v:'select',h:'pan',r:'rectangle',e:'ellipse',d:'diamond',
            a:'arrow',c:'curvedarrow',l:'line',p:'freehand',t:'text',x:'eraser'};
  if(km[e.key.toLowerCase()]) { setTool(km[e.key.toLowerCase()]); return; }

  switch(e.key) {
    case 'Delete': case 'Backspace': deleteSelected(); break;
    case 'Escape':
      if(editId) finishText();
      else { selIds=[]; setTool('select'); render(); }
      break;
  }
});

// ═══════════════════════════════════════════════
//  ELEMENT OPERATIONS
// ═══════════════════════════════════════════════
function deleteSelected() {
  if(!selIds.length) return;
  saveHist();
  const delSet=new Set(selIds);
  elements=elements.filter(e=>!delSet.has(e.id));
  for(const el of elements) {
    if(el.startBinding && delSet.has(el.startBinding.elId)) el.startBinding=null;
    if(el.endBinding && delSet.has(el.endBinding.elId)) el.endBinding=null;
  }
  selIds=[]; updateSidebar(); render();
}
function duplicateSelected() {
  if(!selIds.length) return; saveHist();
  const idMap={};
  const copies=[];
  for(const id of selIds) {
    const el=elements.find(e=>e.id===id); if(!el) continue;
    const cp=JSON.parse(JSON.stringify(el)); const newId=nid++;
    idMap[el.id]=newId; cp.id=newId;
    copies.push(cp);
  }
  for(const cp of copies) {
    if(cp.x!==undefined){cp.x+=22;cp.y+=22;}
    if(cp.x1!==undefined){cp.x1+=22;cp.y1+=22;cp.x2+=22;cp.y2+=22;}
    if(cp.cx!==undefined){cp.cx+=22;cp.cy+=22;}
    if(cp.points) cp.points=cp.points.map(([x,y])=>[x+22,y+22]);
    if(cp.startBinding && idMap[cp.startBinding.elId]!==undefined) cp.startBinding={...cp.startBinding, elId:idMap[cp.startBinding.elId]};
    if(cp.endBinding && idMap[cp.endBinding.elId]!==undefined) cp.endBinding={...cp.endBinding, elId:idMap[cp.endBinding.elId]};
    elements.push(cp);
  }
  selIds=copies.map(c=>c.id); updateSidebar(); render();
}

// ── Copy / Cut / Paste (in-app clipboard) ──────────
let clipboard = null;
function copySelected() {
  if(!selIds.length) return;
  clipboard = selIds.map(id=>elements.find(e=>e.id===id)).filter(Boolean).map(el=>JSON.parse(JSON.stringify(el)));
}
function cutSelected() {
  if(!selIds.length) return;
  copySelected();
  deleteSelected();
}
function pasteClipboard() {
  if(!clipboard || !clipboard.length) return;
  saveHist();
  const idMap={};
  const copies=[];
  for(const el of clipboard) {
    const cp=JSON.parse(JSON.stringify(el)); const newId=nid++;
    idMap[el.id]=newId; cp.id=newId;
    copies.push(cp);
  }
  for(const cp of copies) {
    if(cp.x!==undefined){cp.x+=22;cp.y+=22;}
    if(cp.x1!==undefined){cp.x1+=22;cp.y1+=22;cp.x2+=22;cp.y2+=22;}
    if(cp.cx!==undefined){cp.cx+=22;cp.cy+=22;}
    if(cp.points) cp.points=cp.points.map(([x,y])=>[x+22,y+22]);
    if(cp.startBinding && idMap[cp.startBinding.elId]!==undefined) cp.startBinding={...cp.startBinding, elId:idMap[cp.startBinding.elId]};
    if(cp.endBinding && idMap[cp.endBinding.elId]!==undefined) cp.endBinding={...cp.endBinding, elId:idMap[cp.endBinding.elId]};
    elements.push(cp);
  }
  selIds=copies.map(c=>c.id); updateSidebar(); render();
}

function selAll() { selIds=elements.map(e=>e.id); updateSidebar(); render(); }
function bringFront() {
  if(!selIds.length) return; saveHist();
  for(const id of selIds) {
    const i=elements.findIndex(e=>e.id===id);
    if(i!==-1&&i!==elements.length-1) { const el=elements.splice(i,1)[0]; elements.push(el); }
  }
  render();
}
function sendBack() {
  if(!selIds.length) return; saveHist();
  for(const id of selIds) {
    const i=elements.findIndex(e=>e.id===id);
    if(i>0) { const el=elements.splice(i,1)[0]; elements.unshift(el); }
  }
  render();
}

// ═══════════════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════════════
function newFile() {
  if(elements.length&&!confirm('לפתוח קובץ חדש? השינויים הנוכחיים יאבדו.')) return;
  elements=[];selIds=[];history=[[]];histIdx=0;nid=1;vp={x:0,y:0,s:1};
  updateSidebar(); updZoom(); render();
}
function saveFile() {
  const data=JSON.stringify({version:2,elements,viewport:vp},null,2);
  const a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob([data],{type:'application/json'})),
    download:'drawing.sketchdraw'
  });
  a.click(); URL.revokeObjectURL(a.href);
}
function loadFile() { document.getElementById('file-inp').click(); }
function loadFromFile(inp) {
  const file=inp.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try {
      const d=JSON.parse(e.target.result);
      elements=d.elements||[];
      if(d.viewport) vp=d.viewport;
      selIds=[]; history=[JSON.parse(JSON.stringify(elements))]; histIdx=0;
      if(elements.length) nid=Math.max(...elements.map(el=>el.id||0))+1;
      updateSidebar(); updZoom(); render();
    } catch(err) { alert('שגיאה בטעינה: '+err.message); }
  };
  r.readAsText(file); inp.value='';
}

// ═══════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════
function makeExportCanvas(scale) {
  if(!elements.length) { alert('אין תוכן לייצוא'); return null; }
  let ax=Infinity,ay=Infinity,bx=-Infinity,by=-Infinity;
  for(const el of elements) {
    const b=bbox(el);
    ax=Math.min(ax,b.x);ay=Math.min(ay,b.y);bx=Math.max(bx,b.x+b.w);by=Math.max(by,b.y+b.h);
  }
  const pad=50,W=(bx-ax+pad*2)*scale,H=(by-ay+pad*2)*scale;
  const ec=document.createElement('canvas'); ec.width=W; ec.height=H;
  const ec2=ec.getContext('2d');
  const erc=rough.canvas(ec);
  ec2.fillStyle='#ffffff'; ec2.fillRect(0,0,W,H);
  ec2.save();
  ec2.scale(scale,scale);
  ec2.translate(-ax+pad,-ay+pad);
  for(const el of elements) drawEl(el,ec2,erc);
  ec2.restore();
  return ec;
}

function exportPNG() {
  const ec=makeExportCanvas(3); if(!ec) return;
  ec.toBlob(blob=>{
    const a=Object.assign(document.createElement('a'),{
      href:URL.createObjectURL(blob),download:'drawing.png'
    }); a.click(); URL.revokeObjectURL(a.href);
  },'image/png');
}

async function exportPDF() {
  const ec=makeExportCanvas(3); if(!ec) return;
  const imgData=ec.toDataURL('image/png',1.0);
  const W=ec.width/3, H=ec.height/3;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:W>H?'l':'p',unit:'px',format:[W,H]});
  doc.addImage(imgData,'PNG',0,0,W,H);
  doc.save('drawing.pdf');
}

// ═══════════════════════════════════════════════
//  ICONS (PNG, recolored per element)
// ═══════════════════════════════════════════════
const iconCache = {};
function iconImage(el) {
  const s=el.style;
  const bg = s.fillColor==='transparent' ? '' : s.fillColor;
  const sw = Math.max(0.6, s.strokeWidth*0.8);
  const key = (el.src||el.icon)+'|'+s.strokeColor+'|'+bg+'|'+sw;
  if(iconCache[key]) return iconCache[key];
  const img=new Image();
  const size=256;
  const src=new Image();
  src.onload=()=>{ // compose rounded-square background + icon, rasterize to PNG
    const c=document.createElement('canvas'); c.width=c.height=size;
    const g=c.getContext('2d');
    if(bg) { g.fillStyle=bg; g.beginPath(); g.roundRect(0,0,size,size,size*0.22); g.fill(); }
    const pad=size*(bg?0.18:0.04);
    const iw=src.naturalWidth||size, ih=src.naturalHeight||size, k=Math.min((size-2*pad)/iw,(size-2*pad)/ih);
    g.drawImage(src,(size-iw*k)/2,(size-ih*k)/2,iw*k,ih*k);
    img.onload=()=>render();
    img.src=c.toDataURL('image/png');
  };
  if(el.src) src.src=el.src;
  else {
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 26 26" width="${size}" height="${size}" fill="none" stroke="${s.strokeColor}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[el.icon][1]}</svg>`;
    src.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }
  return iconCache[key]=img;
}

// user-loaded shapes, kept in this browser
let customIcons=[];
try { customIcons=JSON.parse(localStorage.getItem('sketchdraw_customicons')||'[]'); } catch(err) {}
function saveCustomIcons() {
  try { localStorage.setItem('sketchdraw_customicons',JSON.stringify(customIcons)); }
  catch(err) { alert('אין מספיק מקום לשמור את הצורות בדפדפן'); }
}

function buildIconPop() {
  const pop=document.getElementById('icon-pop');
  pop.innerHTML='';
  const add=(title,imgSrc,onclick,oncontext)=>{
    const b=document.createElement('button'); b.title=title;
    const im=document.createElement('img'); b.appendChild(im);
    if(typeof imgSrc==='string') im.src=imgSrc; else imgSrc.then(u=>im.src=u);
    b.onclick=onclick; if(oncontext) b.oncontextmenu=oncontext;
    pop.appendChild(b);
  };
  ICONS.forEach((ic,i)=>add(`${i+1}. ${ic[0]}`, iconPng(i,80,'#1c2b3a'), ()=>insertIcon({icon:i})));
  customIcons.forEach((u,i)=>add('צורה שנטענה (קליק ימני למחיקה)', u, ()=>insertIcon({src:u}), e=>{
    e.preventDefault(); customIcons.splice(i,1); saveCustomIcons(); buildIconPop();
  }));
  const up=document.createElement('button'); up.className='icon-add'; up.title='טען צורות (PNG / SVG / JPG)';
  up.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  up.onclick=()=>document.getElementById('icon-file').click();
  pop.appendChild(up);
}
function loadIconFiles(files) {
  const jobs=[...files].map(f=>new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{ // normalize to a PNG of at most 256px
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,256/Math.max(im.naturalWidth||256,im.naturalHeight||256));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round((im.naturalWidth||256)*k)); c.height=Math.max(1,Math.round((im.naturalHeight||256)*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/png'));
      };
      im.onerror=()=>res(null);
      im.src=r.result;
    };
    r.readAsDataURL(f);
  }));
  Promise.all(jobs).then(urls=>{
    customIcons.push(...urls.filter(Boolean)); saveCustomIcons(); buildIconPop(); toggleIconPop(true);
  });
}
function toggleIconPop(force) {
  const pop=document.getElementById('icon-pop');
  const open=force!==undefined?force:!pop.classList.contains('open');
  pop.classList.toggle('open',open);
  document.getElementById('btn-icons').classList.toggle('active',open);
}
function insertIcon(ref) {
  const c=s2w(canvas.width/2,canvas.height/2), sz=80/vp.s;
  const el=mkEl('icon',c.x-sz/2,c.y-sz/2,c.x+sz/2,c.y+sz/2);
  Object.assign(el,ref);
  if(el.style.strokeWidth<1) el.style.strokeWidth=2;
  saveHist(); elements.push(el);
  toggleIconPop(false); setTool('select');
  selIds=[el.id]; updateSidebar(); render();
}
document.addEventListener('mousedown',e=>{
  if(!e.target.closest('#icon-pop,#btn-icons')) toggleIconPop(false);
});
buildIconPop();

// ═══════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════
function updateSidebar() {
  const sb=document.getElementById('sidebar');
  if(!selIds.length) { sb.classList.remove('open'); return; }
  sb.classList.add('open');

  const sels=selIds.map(id=>elements.find(e=>e.id===id)).filter(Boolean);
  if(!sels.length) { sb.classList.remove('open'); return; }
  const el=sels[0];

  document.getElementById('sl-sw').value=el.style.strokeWidth;
  document.getElementById('val-sw').textContent=el.style.strokeWidth;
  document.getElementById('sl-op').value=Math.round(el.style.opacity*100);
  document.getElementById('val-op').textContent=Math.round(el.style.opacity*100)+'%';

  const isText=sels.some(e=>e.type==='text');
  const isArr=sels.some(e=>e.type==='arrow'||e.type==='curvedarrow');
  const isFH=sels.every(e=>e.type==='freehand');

  document.getElementById('sec-text').style.display=isText?'':'none';
  document.getElementById('sec-arrow').style.display=isArr?'':'none';
  document.getElementById('sec-fill').style.display=isText?'none':'';
  const isIcon=sels.every(e=>e.type==='icon');
  document.getElementById('sec-rough').style.display=(isFH||isIcon)?'none':'';
  document.getElementById('fill-style-btns').style.display=isIcon?'none':'';

  document.getElementById('sw-stroke').style.background=el.style.strokeColor;
  document.getElementById('inp-stroke').value=el.style.strokeColor==='transparent'?'#000000':el.style.strokeColor;
  document.getElementById('sw-fill').style.background=
    el.style.fillColor==='transparent'
      ?'repeating-linear-gradient(45deg,#ddd,#ddd 3px,#fff 3px,#fff 6px)'
      :el.style.fillColor;

  if(isText) {
    document.getElementById('sel-font').value=el.style.fontFamily||'Caveat';
    document.getElementById('inp-fs').value=el.style.fontSize||20;
    document.getElementById('btn-bold').classList.toggle('active',el.style.fontWeight==='bold');
    document.getElementById('btn-italic').classList.toggle('active',el.style.fontStyle==='italic');
    document.querySelectorAll('[data-align]').forEach(b=>b.classList.toggle('active',b.dataset.align===el.style.textAlign));
  }

  document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',+b.dataset.r===el.style.roughness));
  document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('active',b.dataset.fs===el.style.fillStyle));
  document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('active',b.dataset.d===el.style.dashStyle));

  if(isArr) {
    const aval=el.style.arrowStart&&el.style.arrowEnd?'both':el.style.arrowEnd?'end':el.style.arrowStart?'start':'none';
    document.querySelectorAll('[data-arrow]').forEach(b=>b.classList.toggle('active',b.dataset.arrow===aval));
  }
}

function applyProp(prop, val) {
  if(!selIds.length) return;
  saveHist();
  for(const id of selIds) { const el=elements.find(e=>e.id===id); if(el) el.style[prop]=val; }
  render();
}

function setFillStyle(fs) {
  applyProp('fillStyle',fs); defaultStyle.fillStyle=fs;
  document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('active',b.dataset.fs===fs));
}
function setRoughness(r) {
  applyProp('roughness',r); defaultStyle.roughness=r;
  document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',+b.dataset.r===r));
}
function setDash(d) {
  applyProp('dashStyle',d); defaultStyle.dashStyle=d;
  document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('active',b.dataset.d===d));
}
function setArrow(a) {
  const s=a==='start'||a==='both', en=a==='end'||a==='both';
  applyProp('arrowStart',s); applyProp('arrowEnd',en);
  document.querySelectorAll('[data-arrow]').forEach(b=>b.classList.toggle('active',b.dataset.arrow===a));
}
function toggleBold() {
  const el=elements.find(e=>e.id===selIds[0]); if(!el) return;
  const v=el.style.fontWeight==='bold'?'normal':'bold';
  applyProp('fontWeight',v); defaultStyle.fontWeight=v;
  document.getElementById('btn-bold').classList.toggle('active',v==='bold');
}
function toggleItalic() {
  const el=elements.find(e=>e.id===selIds[0]); if(!el) return;
  const v=el.style.fontStyle==='italic'?'normal':'italic';
  applyProp('fontStyle',v); defaultStyle.fontStyle=v;
  document.getElementById('btn-italic').classList.toggle('active',v==='italic');
}
function setAlign(a) {
  applyProp('textAlign',a); defaultStyle.textAlign=a;
  document.querySelectorAll('[data-align]').forEach(b=>b.classList.toggle('active',b.dataset.align===a));
}

// ═══════════════════════════════════════════════
//  COLOR PALETTES INIT
// ═══════════════════════════════════════════════
function initPalettes() {
  document.getElementById('pal-stroke').innerHTML=
    STROKE_COLORS.map(c=>
      `<div class="pc" style="background:${c}" title="${c}"
        onclick="applyProp('strokeColor','${c}');defaultStyle.strokeColor='${c}';document.getElementById('sw-stroke').style.background='${c}'"></div>`
    ).join('');

  document.getElementById('pal-fill').innerHTML=
    FILL_COLORS.map(c=>
      `<div class="pc${c==='transparent'?' trans':''}"` +
      (c!=='transparent'?` style="background:${c}"`:'')+
      ` title="${c}" onclick="applyProp('fillColor','${c}');defaultStyle.fillColor='${c}'"></div>`
    ).join('');
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
initPalettes();
document.getElementById('chk-smartguides').checked = smartGuides;
resize();
</script>
